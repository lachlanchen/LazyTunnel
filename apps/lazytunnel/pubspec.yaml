name: lazytunnel_app
description: A native, optional control room for your own LazyTunnel relay.
publish_to: none
version: 0.2.0+2
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  lazytunnel_client:
    path: ../../packages/lazytunnel_client
  flutter_secure_storage: 11.0.0
  url_launcher: 6.3.2
  xterm: 4.0.0
  webview_flutter: 4.14.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
